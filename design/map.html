<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body, #map { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; }
  .leaflet-tile { filter: saturate(0.7) contrast(0.97); }
  .leaflet-tooltip { font-size: 12px; font-weight: 600; }
  .vis-pill { position: absolute; transform: translate(-50%, -50%); font-size: 10px; font-weight: 700; color: rgba(127,13,0,0.75); background: rgba(253,252,252,0.92); padding: 2px 8px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 5px rgba(50,35,25,0.15); }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="wind" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 500;"></canvas>
<script>
const map = L.map('map', { zoomControl: false }).setView([37.576, 126.786], 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
// RKSS runways (true bearing ≈ 134.6°)
L.polyline([[37.5682, 126.7776], [37.5480, 126.8034]], { color: '#7f0d00', weight: 5, opacity: 0.9 }).addTo(map).bindTooltip('RWY 14R/32L · 사용 중');
L.polyline([[37.5710, 126.7778], [37.5482, 126.8068]], { color: '#7f0d00', weight: 5, opacity: 0.5 }).addTo(map).bindTooltip('RWY 14L/32R');
// approach corridors
L.polyline([[37.5480, 126.8034], [37.5227, 126.8357]], { color: '#7f0d00', weight: 2, dashArray: '6 6', opacity: 0.55 }).addTo(map).bindTooltip('RWY 32L 접근 경로');
L.polyline([[37.5682, 126.7776], [37.5935, 126.7453]], { color: '#7f0d00', weight: 2, dashArray: '6 6', opacity: 0.55 }).addTo(map).bindTooltip('RWY 14R 출발 경로');
// bird activity zones
// ATIS 보고 형식: 방위(8방위) + 거리(NM) + 무리 크기
const ARP0 = [37.5583, 126.7906];
const BRG = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };
function dest(bearing, nm) {
  const d = nm * 1852;
  return [ARP0[0] + d * Math.cos(bearing * Math.PI / 180) / 111320,
          ARP0[1] + d * Math.sin(bearing * Math.PI / 180) / (111320 * Math.cos(ARP0[0] * Math.PI / 180))];
}
// 방위 섹터 (부채꼴): 해당 방위 ±22.5°, 보고 거리 ±1NM 구간
function sector(dir, nm, color, label) {
  const b = BRG[dir], pts = [];
  for (let a = b - 22.5; a <= b + 22.5; a += 4.5) pts.push(dest(a, Math.max(nm - 1, 0.5)));
  for (let a = b + 22.5; a >= b - 22.5; a -= 4.5) pts.push(dest(a, nm + 1));
  L.polygon(pts, { color, weight: 1.5, fillColor: color, fillOpacity: 0.18, interactive: true }).addTo(map).bindTooltip(label);
  L.marker(dest(b, nm), { icon: L.divIcon({ className: '', html: '<div class="vis-pill" style="color:' + color + '">' + label.split(' · ')[0] + '</div>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map);
}
sector('NW', 5, '#e05a2b', 'HVY FLOCK 5NM NW · 큰 무리 (기러기)');
sector('NE', 3, '#d98a0c', 'LGT FLOCK 3NM NE · 작은 무리 (갈매기)');
sector('SE', 2, '#d98a0c', 'LGT FLOCK 2NM SE · 작은 무리');
// recent bird strike reports
const reports = [[37.5665, 126.7845, '조류 충돌 보고 · 08-12 0640Z'], [37.5495, 126.7990, '조류 회피 기동 · 08-14 2110Z']];
reports.forEach(([lat, lng, label]) => {
  L.circleMarker([lat, lng], { radius: 6, color: '#c23a2b', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(map).bindTooltip(label);
});

// ---- 시정 반경 (공항 기준점 고정 — 지도와 함께 이동) ----
const ARP = [37.5583, 126.7906];
const visCircle = L.circle(ARP, { radius: 8000, color: 'rgba(127,13,0,0.45)', weight: 2, dashArray: '8 7', fillColor: '#7f0d00', fillOpacity: 0.03, interactive: false }).addTo(map);
const visLabel = L.marker(ARP, { icon: L.divIcon({ className: '', html: '<div class="vis-pill">VIS —</div>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map);

// ---- Windy 스타일 바람 파티클 ----
const cv = document.getElementById('wind');
const ctx = cv.getContext('2d');
let W = 0, H = 0, parts = [];
let wind = { dir: 320, spd: 8 };
// 풍속 → 색상 (Windy 스타일 스케일, KT)
function colKt(s) { return s <= 6 ? '91,139,201' : s <= 9 ? '74,168,140' : s <= 12 ? '143,184,78' : s <= 15 ? '217,184,58' : s <= 18 ? '224,138,53' : '200,66,46'; }
function spawn() { return { x: Math.random() * W, y: Math.random() * H, life: 50 + Math.random() * 90, ph: Math.random() * 6.28 }; }
function resize() {
  W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight;
  parts = Array.from({ length: Math.min(900, Math.round(W * H / 5500)) }, spawn);
}
addEventListener('resize', resize); resize();
(function tick() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.075)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const h = (wind.dir + 180) * Math.PI / 180;
  const v = 0.45 + wind.spd * 0.16;
  const dx = Math.sin(h), dy = -Math.cos(h);
  ctx.lineWidth = 1.2 + wind.spd * 0.07; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(' + colKt(wind.spd) + ',0.6)';
  for (const p of parts) {
    p.ph += 0.05; const wob = Math.sin(p.ph) * 0.28;
    const nx = p.x + (dx - dy * wob) * v, ny = p.y + (dy + dx * wob) * v;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
    p.x = nx; p.y = ny;
    if (--p.life <= 0 || p.x < -12 || p.x > W + 12 || p.y < -12 || p.y > H + 12) Object.assign(p, spawn());
  }
  requestAnimationFrame(tick);
})();

// ---- 부모(DC)에서 ATIS 상태 수신 ----
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'atis') return;
  wind = { dir: d.dir, spd: d.spd };
  cv.style.display = d.showWind === false ? 'none' : '';
  const rm = Math.min(d.vis, 10) * 1000;
  const col = d.vis < 10 ? '#c8871c' : 'rgba(127,13,0,0.45)';
  if (d.showVis) {
    visCircle.setStyle({ opacity: 1, fillOpacity: 0.03, color: col });
    visCircle.setRadius(rm);
    visLabel.setLatLng([ARP[0] + rm / 111320, ARP[1]]);
    const pill = visLabel.getElement().querySelector('.vis-pill');
    pill.textContent = 'VIS ' + d.visTxt;
    pill.style.color = col;
    visLabel.getElement().style.display = '';
  } else {
    visCircle.setStyle({ opacity: 0, fillOpacity: 0 });
    visLabel.getElement().style.display = 'none';
  }
});
</script>
</body>
</html>
